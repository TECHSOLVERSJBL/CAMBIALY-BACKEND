[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Tests unitarios rápidos",
    "integration: Tests de integración",
    "slow: Tests lentos (scrapers, HTTP real)"
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 70