services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
