services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - LOCAL_REDIS_URL=${LOCAL_REDIS_URL}
      - APP_ENV=${APP_ENV}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
